var S = window.StayInTrack, html = htm.bind(React.createElement), useState = React.useState;
function Shell(p) {
  return html`<div class="sit-root" style=${{minHeight: p.h + 'px'}}>
    <${S.NavBar} active=${p.active} user="Ana" ...${SITFlow.nav}/>
    <${S.DoodleField} seed=${p.seed} count=${15} style=${{minHeight: (p.h - 62) + 'px'}}>
      <main style=${{maxWidth: '1180px', margin: '0 auto', padding: '36px 40px 56px'}}>${p.children}</main>
    <//>
  </div>`;
}
var sub = {margin: '10px 0 0', fontSize: '18px', lineHeight: '28px', color: 'var(--ink-muted)', maxWidth: '640px'};
var label = {fontSize: '12px', lineHeight: '16px', fontWeight: 600, letterSpacing: '1.2px', textTransform: 'uppercase', color: 'var(--ink-muted)'};
var hand = {fontFamily: 'var(--font-script)', fontSize: '24px', lineHeight: '28px'};

var WHEN = ['In 25 min', 'After lunch', 'Tonight, 8:00 pm', 'Tomorrow'];
var COLORS = ['butter', 'rose', 'sky', 'sage'];
function App() {
  var list = useState([
    {t: 'Check Instagram', w: 'Tonight, 8:00 pm'},
    {t: 'Watch the new episode', w: 'Tomorrow'},
    {t: 'Look up that recipe', w: 'After lunch'},
    {t: 'Buy new headphones', w: 'Tomorrow'}
  ]);
  var txt = useState(''), when = useState(0), done = useState({});
  function add() { if (!txt[0].trim()) return; list[1]([{t: txt[0].trim(), w: WHEN[when[0]]}].concat(list[0])); txt[1](''); }
  var step = txt[0] ? 2 : 1;
  return html`<${Shell} active="wish" seed=${41} h=${1000}>
    <${S.HandTitle} as="h1" size="lg">Catch a wish<//>
    <p style=${sub}>When the urge to grab your phone hits, don't fight it and don't follow it. Write it down and choose when you'll get to it.</p>
    <div style=${{display: 'grid', gridTemplateColumns: '0.9fr 1.4fr', gap: '32px', marginTop: '28px', alignItems: 'start'}}>
      <${S.ScallopCard} tone="blush">
        <div style=${{padding: '8px 4px'}}>
          <div style=${Object.assign({}, label, {marginBottom: '16px', color: 'var(--ink)'})}>How it works</div>
          <${S.StepList} active=${step} steps=${['Carry your phone everywhere.', 'Feel the wish.', 'Choose when to check it.', "Let's practice."]}/>
        </div>
      <//>
      <${S.JournalPage} pattern="dot" title="I feel like…">
        <div style=${{display: 'grid', gap: '18px'}}>
          <${S.TextField} script placeholder="checking my messages" value=${txt[0]} onChange=${function (e) { txt[1](e.target.value); }}/>
          <div style=${{display: 'grid', gap: '8px'}}>
            <span style=${label}>When will I check it?</span>
            <div class="sit-chiprow">
              ${WHEN.map(function (w, i) { return html`<button key=${w} class=${'sit-chip' + (when[0] === i ? ' is-on' : '')} aria-pressed=${when[0] === i} onClick=${function () { when[1](i); }}>${w}</button>`; })}
            </div>
          </div>
          <div><${S.Button} variant="soft" size="lg" onClick=${add}>Catch it<//></div>
        </div>
      <//>
    </div>
    <div style=${{marginTop: '40px', display: 'flex', alignItems: 'center', justifyContent: 'space-between'}}>
      <${S.HandTitle} size="md" underline="blush">Caught wishes<//>
      <${S.Badge} tone="butter">${list[0].length} waiting<//>
    </div>
    <div style=${{display: 'flex', flexWrap: 'wrap', gap: '32px', marginTop: '28px', paddingLeft: '8px'}}>
      ${list[0].map(function (x, i) { var d = done[0][x.t]; return html`<${S.StickyNote} key=${x.t} color=${COLORS[i % 4]} rotate=${[-2, 2, -1, 3][i % 4]} pin=${i % 2 ? 'pin' : 'tape'} style=${{width: '220px', opacity: d ? 0.55 : 1}}>
        <div style=${{textDecoration: d ? 'line-through' : 'none'}}>${x.t}</div>
        <div style=${{marginTop: '14px'}}><span class="sit-badge sit-badge-neutral" style=${{background: 'var(--paper-raised)', color: 'var(--on-sticky)'}}>${x.w}</span></div>
        <div style=${{display: 'flex', gap: '4px', marginTop: '10px', fontFamily: 'var(--font-body)'}}>
          <button class="sit-chip" style=${{borderColor: 'var(--on-sticky)', color: 'var(--on-sticky)', background: 'transparent'}} onClick=${function () { var o = Object.assign({}, done[0]); o[x.t] = !d; done[1](o); }}>${d ? 'Undo' : 'Checked it'}</button>
        </div>
      <//>`; })}
    </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
<button id="sit-theme" type="button" style="position:fixed;right:16px;bottom:16px;z-index:99;font:600 13px/18px Hind,system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--paper-raised);color:var(--ink);cursor:pointer">Dark mode</button>

function set(t){r.setAttribute('data-theme',t);b.textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('sit-theme',t)}catch(e){}}
var s='light';try{s=localStorage.getItem('sit-theme')||'light'}catch(e){}set(s);
b.onclick=function(){set(r.getAttribute('data-theme')==='dark'?'light':'dark')};})();
