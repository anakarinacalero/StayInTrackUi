var S = window.StayInTrack, html = htm.bind(React.createElement), useState = React.useState, DATA = window.SIT_SAMPLE;
var sub = {margin: '10px 0 0', fontSize: '18px', lineHeight: '28px', color: 'var(--ink-muted)', maxWidth: '660px'};
function Shell(p) {
  return html`<div class="sit-root" style=${{minHeight: '100vh'}}>
    <${S.NavBar} active="tracker" user="Ana" ...${SITFlow.nav}/>
    <${S.DoodleField} seed=${58} count=${14} style=${{minHeight: 'calc(100vh - 62px)'}}>
      <main style=${{maxWidth: '1180px', margin: '0 auto', padding: '28px clamp(16px, 4vw, 40px) 64px'}}>${p.children}</main>
    <//>
  </div>`;
}
function App() {
  var q = null; try { q = new URLSearchParams(location.search).get('date'); } catch (e) {}
  var ws = useState(S.startOfWeek(q || null || DATA.today)), loading = useState(false);
  var week = React.useMemo(function () { return S.buildWeek(DATA.habits, DATA.sheets, ws[0]); }, [ws[0]]);
  function change(w) {
    // Replace with: fetch('/api/habits/week?date=' + w).then(r => r.json()).then(setWeek)
    loading[1](true);
    try { if (true) history.replaceState(null, '', '?date=' + w); } catch (e) {}
    setTimeout(function () { ws[1](w); loading[1](false); }, 250);
  }
  return html`<${Shell}>
    <div style=${{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
      <${S.Button} variant="ghost" size="sm" onClick=${function () { location.href = 'my-habits-calendar.html'; }}>← My habits<//>
      <${S.Button} variant="ghost" size="sm" onClick=${function () { SITFlow.go('weekly-summary.html?date=' + ws[0]); }}><${S.Doodle} kind="sparkle" tone="mustard" size=${14}/> Summary of this week<//>
    </div>
    <div style=${{marginTop: '8px'}}><${S.HandTitle} as="h1" size="lg" accent="week">My<//></div>
    <p style=${sub}>Only the habits you tracked that week, day by day. Use the arrows or jump to any date.</p>
    <div style=${{marginTop: '28px'}}>
      <${S.WeekView} week=${week} today=${DATA.today} loading=${loading[0]} onWeekChange=${change}
        onOpenHabit=${function (h) { if (true) location.href = 'habit.html?id=' + encodeURIComponent(h.id); }}
        onCreate=${function () { if (true) location.href = 'create-habit.html'; }}/>
    </div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
