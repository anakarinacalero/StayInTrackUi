<script src="../ai-demo.js"></script><style>html,body{margin:0;background:var(--paper)}</style></head>
<body>
<div id="root"></div>
<script>

var S = window.StayInTrack, html = htm.bind(React.createElement), useState = React.useState;
function Shell(p) {
  return html`<div class="sit-root" style=${{minHeight: p.h + 'px'}}>
    <${S.NavBar} active=${p.active} user="Ana" ...${SITFlow.nav}/>
    <${S.DoodleField} seed=${p.seed} count=${15} style=${{minHeight: (p.h - 62) + 'px'}}>
      <main style=${{maxWidth: '1180px', margin: '0 auto', padding: '36px 40px 56px'}}>${p.children}</main>
    <//>
  </div>`;
}
var sub = {margin: '10px 0 0', fontSize: '18px', lineHeight: '28px', color: 'var(--ink-muted)', maxWidth: '640px'};
var label = {fontSize: '12px', lineHeight: '16px', fontWeight: 600, letterSpacing: '1.2px', textTransform: 'uppercase', color: 'var(--ink-muted)'};
var hand = {fontFamily: 'var(--font-script)', fontSize: '24px', lineHeight: '28px'};

var A = window.SITAI, LVL = ['missed', 'min', 'ok', 'ideal'];
/* Read-only day: logging happens in one place, the Minimal tracker. */
function DayRow(p) {
  var v = p.level, future = p.date > A.today;
  return html`<div class="sit-habit" style=${{opacity: future ? 0.5 : 1}}>
    <span class=${'sit-day' + (v > 0 ? ' is-on' : '')}>${Number(p.date.slice(8))}</span>
    <span class="sit-leader" aria-hidden="true"></span>
    <div class="sit-bar" role="img" aria-label=${A.fmt(p.date, {weekday: 'long'}) + ': ' + (v === null || v === undefined ? 'not logged' : LVL[v])}><div class=${'sit-bar-fill lvl-' + (v || 0)}></div></div>
    <span class="sit-habit-lvl">${v === null || v === undefined ? (p.date === A.today ? 'today' : '—') : LVL[v] || '—'}</span>
  </div>`;
}
function App() {
  // Same list as the helper (Ask the helper): crossing out here crosses out there.
  var tasks = A.useStore(A.tasks), done = tasks.filter(function (x) { return x.c; }).length;
  function setTask(i, v) { A.tasks.update(tasks[i].id, {c: v}); }
  var hw = A.habit('h-meditate'), sheet = A.currentSheet('h-meditate');
  var ws = A.weekStart(A.today), days = [0, 1, 2, 3, 4, 5, 6].map(function (i) { var d = A.addDays(ws, i); return {date: d, level: A.levelOn('h-meditate', d)}; });
  var todayLvl = A.levelOn('h-meditate', A.today);
  var tools = [
    {id: 'distractors', k: 'plus', tone: 'ink', t: 'Distractors', n: 'List what pulls you away, decide what to do with it.', b: '6 listed'},
    {id: 'tracker', k: 'flower', tone: 'blush', t: 'Minimal tracker', n: 'Min, ok and ideal for one habit, seven days.', b: sheet.days.filter(function (d) { return d.level >= 1; }).length + ' of ' + sheet.days.length + ' days'},
    {id: 'wish', k: 'cloud', tone: 'ink', t: 'Catch a wish', n: 'Park the urge now, check it at a time you choose.', b: '3 waiting'}
  ];
  return html`<${Shell} active="home" seed=${21} h=${1080}>
    <div style=${{display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: '24px'}}>
      <div>
        <div style=${Object.assign({}, hand, {color: 'var(--ink-muted)'})}>${A.fmt(A.today, {weekday: 'long', month: 'long', day: 'numeric'})}</div>
        <${S.HandTitle} as="h1" size="lg" accent="Ana">Good afternoon,<//>
      </div>
      <div style=${{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
        <${S.Button} variant="ghost" onClick=${function () { SITFlow.go('helper.html?q=' + encodeURIComponent('Where do I start?')); }}><${S.Doodle} kind="sparkle" tone="mustard" size=${16}/> Where do I start?<//>
        <${S.Button} variant="soft">+ Add a task<//>
      </div>
    </div>
    <div style=${{display: 'grid', gridTemplateColumns: '1.35fr 1fr 0.8fr', gap: '28px', marginTop: '28px', alignItems: 'start'}}>
      <${S.JournalPage} pattern="dash" title="Today, by priority">
        ${tasks.map(function (x, i) { return html`<${S.CheckItem} key=${i} checked=${x.c} priority=${x.p} onChange=${function (v) { setTask(i, v); }}>${x.txt}<//>`; })}
        <div style=${{marginTop: '20px'}}>
          <div style=${{display: 'flex', justifyContent: 'space-between', marginBottom: '8px'}}><span style=${label}>Self-check</span><span style=${{fontSize: '14px', color: 'var(--ink-muted)'}}>${done} of ${tasks.length} crossed out</span></div>
          <div class="sit-bar" style=${{display: 'block'}}><div class="sit-bar-fill" style=${{width: (done / tasks.length * 100) + '%'}}></div></div>
          <p style=${Object.assign({}, hand, {margin: '12px 0 0'})}>${done >= 3 ? 'Pat on the back. Good work today!' : 'One thing at a time.'}</p>
        </div>
      <//>
      <${S.JournalPage} pattern="dot" binding="none" title="Habit of the week">
        <div style=${{display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginTop: '-8px', marginBottom: '14px'}}>
          <span style=${Object.assign({}, hand, {fontSize: '26px'})}>${hw.name}</span>
          <span style=${{fontSize: '14px', color: 'var(--ink-muted)'}}>${hw.targets.min} · ${hw.targets.ok} · ${hw.targets.ideal} ${hw.unit}</span>
        </div>
        <div style=${{display: 'grid', gap: '8px'}}>
          ${days.map(function (d) { return html`<${DayRow} key=${d.date} date=${d.date} level=${d.level}/>`; })}
        </div>
        <div style=${{marginTop: '14px', display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center'}}>
          <${S.Button} variant=${todayLvl === null || todayLvl === undefined ? 'soft' : 'ghost'} size="sm" onClick=${function () { SITFlow.go('minimal-tracker.html?habit=h-meditate'); }}>${todayLvl === null || todayLvl === undefined ? 'Log today' : 'Open the tracker'}<//>
          ${todayLvl === null || todayLvl === undefined ? null : html`<span style=${{fontSize: '14px', color: 'var(--ink-muted)'}}>Today: ${LVL[todayLvl]}</span>`}
        </div>
      <//>
      <div style=${{display: 'grid', gap: '28px', justifyItems: 'center'}}>
        <${S.StickyNote} color="butter" rotate=${2} style=${{width: '100%'}}>There's no perfect moment to act.<//>
        <${S.ScallopCard} tone="blush" style=${{width: '100%'}}>
          <div style=${label}>Caught wishes</div>
          <div style=${{fontFamily: 'var(--font-display)', fontSize: '28px', lineHeight: '34px', margin: '4px 0'}}>3 waiting</div>
          <div style=${{fontSize: '14px'}}>Next: <b>check Instagram</b> at 8:00 pm</div>
          <div style=${{marginTop: '10px'}}><${S.Button} variant="ghost" size="sm" onClick=${function () { SITFlow.go('wish'); }}>See my wishes<//></div>
        <//>
        <${S.ScallopCard} style=${{width: '100%'}}>
          <div style=${label}>Tip of the day</div>
          <div style=${{display: 'flex', gap: '12px', alignItems: 'center', marginTop: '6px'}}>
            <span style=${{fontFamily: 'var(--font-display)', fontSize: '44px', lineHeight: '44px', color: 'var(--rose)'}}>04</span>
            <span style=${{fontSize: '14px', lineHeight: '20px'}}>Start small. You don't have to do it all at once.</span>
          </div>
          <div style=${{marginTop: '10px'}}><${S.Button} variant="ghost" size="sm" onClick=${function () { SITFlow.go('suggestions'); }}>All 8 tips<//></div>
        <//>
      </div>
    </div>
    <div style=${{marginTop: '44px'}}>
      <${S.HandTitle} size="md" underline="blush">Your tools<//>
      <div style=${{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '24px', marginTop: '20px'}}>
        ${tools.map(function (x) { return html`<${S.ScallopCard} key=${x.t}>
          <div style=${{display: 'flex', alignItems: 'center', gap: '10px'}}><${S.Doodle} kind=${x.k} tone=${x.tone} size=${22}/><span style=${{fontFamily: 'var(--font-display)', fontSize: '22px', lineHeight: '28px', whiteSpace: 'nowrap'}}>${x.t}</span><span style=${{marginLeft: 'auto'}}><${S.Badge}>${x.b}<//></span></div>
          <p style=${{margin: '8px 0 6px', fontSize: '15px', lineHeight: '22px', color: 'var(--ink-muted)'}}>${x.n}</p>
          <${S.Button} variant="ghost" size="sm" onClick=${function () { SITFlow.go(x.id); }}>Open<//>
        <//>`; })}
      </div>
    </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
<button id="sit-theme" type="button" style="position:fixed;right:16px;bottom:16px;z-index:99;font:600 13px/18px Hind,system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--paper-raised);color:var(--ink);cursor:pointer">Dark mode</button>
<a href="../index.html" style="position:fixed;left:16px;bottom:16px;z-index:99;font:600 13px/18px Hind,system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--paper-raised);color:var(--ink);text-decoration:none">&larr; App flow</a>
<script>
(function(){var b=document.getElementById('sit-theme'),r=document.documentElement;
function set(t){r.setAttribute('data-theme',t);b.textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('sit-theme',t)}catch(e){}}
var s='light';try{s=localStorage.getItem('sit-theme')||'light'}catch(e){}set(s);
b.onclick=function(){set(r.getAttribute('data-theme')==='dark'?'light':'dark')};})();
</script>
