var S = window.StayInTrack, html = htm.bind(React.createElement), useState = React.useState;
function Shell(p) {
  return html`<div class="sit-root" style=${{minHeight: '100vh'}}>
    <${S.NavBar} active="tracker" user="Ana" ...${SITFlow.nav}/>
    <${S.DoodleField} seed=${p.seed} count=${15} style=${{minHeight: 'calc(100vh - 62px)'}}>
      <main style=${{maxWidth: '1180px', margin: '0 auto', padding: '28px clamp(16px, 4vw, 40px) 64px'}}>${p.children}</main>
    <//>
  </div>`;
}
var sub = {margin: '10px 0 0', fontSize: '18px', lineHeight: '28px', color: 'var(--ink-muted)', maxWidth: '660px'};
var DATA = window.SIT_SAMPLE;
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function Board(p) {
  return html`<${S.HandTitle} as="h1" size="lg" accent="habits">My<//>
    <p style=${sub}>Everything you're tracking, one post-it each. Open a habit to see all its sheets.</p>
    <div style=${{marginTop: '28px'}}>
      <${S.HabitBoard} habits=${p.habits} onOpen=${p.onOpen} onCreate=${p.onCreate}
        onDelete=${function (h) { return wait(400).then(function () { p.onDeleted(h.id); }); }}/>
    </div>`;
}

function Detail(p) {
  var h = p.habits.filter(function (x) { return x.id === p.id; })[0];
  var running = (DATA.sheets[h ? h.id : ''] || []).some(function (s) { return s.startDate <= DATA.today && DATA.today <= s.endDate; });
  if (!h) return html`<${S.Button} variant="ghost" size="sm" onClick=${p.onBack}>← My habits<//><p style=${sub}>This habit doesn't exist anymore.</p>`;
  return html`<${S.HabitDetail} habit=${h} sheets=${DATA.sheets[h.id] || []} today=${DATA.today} onBack=${p.onBack}
    onNewSheet=${running ? null : function () {
      // Replace with POST /api/habits/{id}/sheets  { startDate: today }. Only offered when no sheet is running.
      DATA.saveNewSheet(h.id, DATA.today);
      location.href = 'minimal-tracker.html?habit=' + encodeURIComponent(h.id);
    }} onDelete=${function () { return wait(400).then(function () { p.onDeleted(h.id); p.onBack(); }); }}/>`;
}

function App() {
  var id = new URLSearchParams(location.search).get('id') || DATA.habits[0].id;
  var hs = useState(DATA.habits);
  return html`<${Shell} seed=${44}><${Detail} id=${id} habits=${hs[0]}
    onBack=${function () { location.href = 'my-habits-calendar.html'; }}
    onDeleted=${function (x) { hs[1](hs[0].filter(function (y) { return y.id !== x; })); }}/><//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

function set(t){r.setAttribute('data-theme',t);b.textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('sit-theme',t)}catch(e){}}
var s='light';try{s=localStorage.getItem('sit-theme')||'light'}catch(e){}set(s);
b.onclick=function(){set(r.getAttribute('data-theme')==='dark'?'light':'dark')};})();
</script>
