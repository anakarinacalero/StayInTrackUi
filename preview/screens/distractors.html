<!doctype html>

var S = window.StayInTrack, html = htm.bind(React.createElement), useState = React.useState;
function Shell(p) {
  return html`<div class="sit-root" style=${{minHeight: p.h + 'px'}}>
    <${S.NavBar} active=${p.active} user="Ana" ...${SITFlow.nav}/>
    <${S.DoodleField} seed=${p.seed} count=${15} style=${{minHeight: (p.h - 62) + 'px'}}>
      <main style=${{maxWidth: '1180px', margin: '0 auto', padding: '36px 40px 56px'}}>${p.children}</main>
    <//>
  </div>`;
}
var sub = {margin: '10px 0 0', fontSize: '18px', lineHeight: '28px', color: 'var(--ink-muted)', maxWidth: '640px'};
var label = {fontSize: '12px', lineHeight: '16px', fontWeight: 600, letterSpacing: '1.2px', textTransform: 'uppercase', color: 'var(--ink-muted)'};
var hand = {fontFamily: 'var(--font-script)', fontSize: '24px', lineHeight: '28px'};

function outcome(x) {
  var b = [];
  if (x.ctl === true) b.push(html`<${S.Badge} tone="sage">Take action<//>`);
  if (x.ctl === false) b.push(html`<${S.Badge}>Accept it<//>`);
  if (x.pri === true) b.push(html`<${S.Badge} tone="rose">Start here<//>`);
  if (x.pri === false) b.push(html`<${S.Badge} tone="sky">It can wait<//>`);
  return b;
}
function List(p) {
  return html`<${S.JournalPage} pattern="dash" binding=${p.bind ? 'disc' : 'none'}>
    <div class="sit-ruled-title" style=${{display: 'flex', justifyContent: 'space-between'}}>${p.title}<span style=${{fontFamily: 'var(--font-body)', fontSize: '14px', color: 'var(--ink-muted)'}}>${p.sub}</span></div>
    <div style=${{borderTop: '2px solid var(--rule)'}}>
      ${p.items.map(function (x, i) { return html`<div key=${i} style=${{borderBottom: '2px solid var(--rule)', padding: '12px 4px', display: 'grid', gap: '8px'}}>
        <div style=${{display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px'}}>
          <span style=${hand}>${x.t}</span><span style=${{display: 'flex', gap: '6px'}}>${outcome(x)}</span>
        </div>
        <div style=${{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '18px'}}>
          <${S.Choice} question="Can I control it?" value=${x.ctl} onChange=${function (v) { p.set(i, 'ctl', v); }}/>
          <${S.Choice} question="Is it a priority?" value=${x.pri} onChange=${function (v) { p.set(i, 'pri', v); }}/>
        </div>
      </div>`; })}
    </div>
  <//>`;
}
function App() {
  var e = useState([{t: 'Social media', ctl: true, pri: false}, {t: 'Other pending tasks', ctl: true, pri: true}, {t: 'Street noise', ctl: false, pri: null}]);
  var n = useState([{t: 'Hunger (a basic need)', ctl: true, pri: true}, {t: 'Personal problems', ctl: false, pri: true}, {t: 'Boredom', ctl: true, pri: false}]);
  var kind = useState('ext'), txt = useState('');
  function setter(st) { return function (i, k, v) { var a = st[0].slice(); a[i] = Object.assign({}, a[i]); a[i][k] = v; st[1](a); }; }
  function add() { if (!txt[0].trim()) return; var st = kind[0] === 'ext' ? e : n; st[1](st[0].concat([{t: txt[0].trim(), ctl: null, pri: null}])); txt[1](''); }
  return html`<${Shell} active="distractors" seed=${33} h=${1100}>
    <${S.HandTitle} as="h1" size="lg">Let's list the distractors<//>
    <p style=${sub}>Write down what pulls you away, then ask two questions about each one.</p>
    <${S.ScallopCard} style=${{marginTop: '28px'}}>
      <div style=${{display: 'grid', gridTemplateColumns: '1fr auto auto', gap: '20px', alignItems: 'end', padding: '4px 0'}}>
        <${S.TextField} label="What pulls me away?" script placeholder="e.g. notifications" value=${txt[0]} onChange=${function (ev) { txt[1](ev.target.value); }}/>
        <div style=${{display: 'grid', gap: '8px'}}><span style=${label}>It comes from</span>
          <div class="sit-chiprow">
            <button class=${'sit-chip' + (kind[0] === 'ext' ? ' is-on' : '')} onClick=${function () { kind[1]('ext'); }}>Outside</button>
            <button class=${'sit-chip' + (kind[0] === 'int' ? ' is-on' : '')} onClick=${function () { kind[1]('int'); }}>Inside me</button>
          </div>
        </div>
        <${S.Button} variant="soft" onClick=${add}>+ Add to list<//>
      </div>
    <//>
    <div style=${{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '28px', marginTop: '28px'}}>
      <${List} title="External" sub="outside me" items=${e[0]} set=${setter(e)} bind/>
      <${List} title="Internal" sub="inside me" items=${n[0]} set=${setter(n)}/>
    </div>
    <div style=${{display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '28px', marginTop: '32px', alignItems: 'center'}}>
      <${S.DecisionTable} columns=${[{question: 'Can I control it?', yes: 'Then let us take action.', no: 'We learn to accept it is there.'}, {question: 'Is it a priority?', yes: 'Start with the priority tasks.', no: 'It can wait.'}]}/>
      <div style=${{display: 'grid', gap: '18px', justifyItems: 'start'}}>
        <${S.StickyNote} color="sky" rotate=${-2} style=${{width: '100%'}}>Can't control it and it's not a priority? Let it be and keep going.<//>
        <${S.Button} variant="ghost" size="sm" onClick=${function () { SITFlow.go('summary-distractions'); }}><${S.Doodle} kind="sparkle" tone="mustard" size=${14}/> When do they show up?<//>
      </div>
    </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

function set(t){r.setAttribute('data-theme',t);b.textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('sit-theme',t)}catch(e){}}
var s='light';try{s=localStorage.getItem('sit-theme')||'light'}catch(e){}set(s);
