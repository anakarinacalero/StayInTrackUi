<script>

var S = window.StayInTrack, html = htm.bind(React.createElement), useState = React.useState;
function Shell(p) {
  return html`<div class="sit-root" style=${{minHeight: p.h + 'px'}}>
    <${S.NavBar} active=${p.active} user="Ana" ...${SITFlow.nav}/>
    <${S.DoodleField} seed=${p.seed} count=${15} style=${{minHeight: (p.h - 62) + 'px'}}>
      <main style=${{maxWidth: '1180px', margin: '0 auto', padding: '28px clamp(16px, 4vw, 40px) 56px'}}>${p.children}</main>
    <//>
  </div>`;
}
var sub = {margin: '10px 0 0', fontSize: '18px', lineHeight: '28px', color: 'var(--ink-muted)', maxWidth: '660px'};
var label = {fontSize: '12px', lineHeight: '16px', fontWeight: 600, letterSpacing: '1.2px', textTransform: 'uppercase', color: 'var(--ink-muted)'};
var hand = {fontFamily: 'var(--font-script)', fontSize: '24px', lineHeight: '28px'};

function Success(p) {
  var h = p.habit;
  return html`<div style=${{display: 'grid', gridTemplateColumns: 'minmax(0, 1.2fr) minmax(0, 1fr)', gap: '32px', marginTop: '28px', alignItems: 'start'}}>
    <${S.ScallopCard} tone="paper">
      <div style=${{padding: '8px 6px'}}>
        <div style=${{display: 'flex', alignItems: 'center', gap: '10px'}}><${S.Doodle} kind="sprout" tone="ink" size=${28}/><${S.Badge} tone="sage">Saved<//></div>
        <div style=${{fontFamily: 'var(--font-display)', fontSize: '34px', lineHeight: '40px', margin: '12px 0 4px'}}>${h.name} is on your tracker</div>
        <p style=${{margin: 0, color: 'var(--ink-muted)'}}>Starts ${h.startDate} · ${h.lengthDays} days${h.reminderTime ? ' · reminder at ' + h.reminderTime : ''}</p>
        <div style=${{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '12px', margin: '20px 0'}}>
          ${['min', 'ok', 'ideal'].map(function (k) { return html`<div key=${k} style=${{background: 'var(--paper-sunk)', borderRadius: '12px', padding: '10px 12px', textAlign: 'center'}}>
            <div style=${label}>${k}</div><div style=${{fontFamily: 'var(--font-script)', fontSize: '28px', lineHeight: '32px'}}>${h.targets[k]} ${h.unit}</div></div>`; })}
        </div>
        ${h.reasons.length ? html`<div style=${label}>Why it matters</div><ul style=${{margin: '6px 0 0', paddingLeft: '20px', fontFamily: 'var(--font-script)', fontSize: '24px', lineHeight: '30px'}}>${h.reasons.map(function (r) { return html`<li key=${r}>${r}</li>`; })}</ul>` : null}
        <div style=${{display: 'flex', gap: '12px', marginTop: '24px', flexWrap: 'wrap'}}>
          <${S.Button} variant="primary" onClick=${function () {
            location.href = 'minimal-tracker.html?habit=' + encodeURIComponent(p.id);
          }}>Open my tracker<//>
          <${S.Button} variant="secondary" onClick=${p.onAgain}>Create another habit<//>
        </div>
      </div>
    <//>
    <div>
      <div style=${Object.assign({}, label, {marginBottom: '18px'})}>Your motivation board · ${h.notes.length} notes</div>
      <div style=${{display: 'flex', flexWrap: 'wrap', gap: '24px', paddingLeft: '8px'}}>
        ${h.notes.length ? h.notes.map(function (n, i) { return html`<${S.StickyNote} key=${i} color=${n.color} rotate=${[-2, 2, -1, 3][i % 4]} style=${{width: '180px', minHeight: '150px'}}>${n.text}<//>`; })
          : html`<p style=${hand}>No notes yet. You can add them from the tracker.</p>`}
      </div>
    </div>
  </div>`;
}
function App() {
  var saved = useState(null), key = useState(0);
  function save(payload) {
    // Replace with your API call, e.g. fetch('/api/habits', {method: 'POST', body: JSON.stringify(payload)})
    console.log('CreateHabit payload', payload);
    return new Promise(function (r) { setTimeout(function () {
      // Preview only: remember the habit so the tracker and My habits show it. In the app it comes from the API.
      var id = window.SIT_SAMPLE.saveCreatedHabit(payload);
      saved[1](Object.assign({id: id}, payload)); r();
    }, 500); });
  }
  return html`<${Shell} active="tracker" seed=${27} h=${1500}>
    <${S.Button} variant="ghost" size="sm" onClick=${function () { location.href = 'minimal-tracker.html'; }}>← Minimal tracker<//>
    <div style=${{marginTop: '8px'}}><${S.HandTitle} as="h1" size="lg" accent="habit">Create a<//></div>
    <p style=${sub}>Pick one habit and three targets: the minimum that still counts, an ok day and your ideal. Then fill the board with notes for the hard days.</p>
    ${saved[0]
      ? html`<${Success} habit=${saved[0]} id=${saved[0].id} onAgain=${function () { saved[1](null); key[1](key[0] + 1); }}/>`
      : html`<div style=${{marginTop: '28px'}} key=${key[0]}><${S.CreateHabitForm} onSubmit=${save} onCancel=${function () { location.href = 'minimal-tracker.html'; }}/></div>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
<button id="sit-theme" type="button" style="position:fixed;right:16px;bottom:16px;z-index:99;font:600 13px/18px Hind,system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--paper-raised);color:var(--ink);cursor:pointer">Dark mode</button>
<script>
(function(){var b=document.getElementById('sit-theme'),r=document.documentElement;
function set(t){r.setAttribute('data-theme',t);b.textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('sit-theme',t)}catch(e){}}
var s='light';try{s=localStorage.getItem('sit-theme')||'light'}catch(e){}set(s);
b.onclick=function(){set(r.getAttribute('data-theme')==='dark'?'light':'dark')};})();
</script>
